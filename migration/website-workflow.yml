name: Build and publish the unified website
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: unified-website
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the preserved website once
        run: |
          if [ ! -f migration-report.json ]; then
            python migration/build-website.py --repository "${{ github.event.repository.name }}" --output .
            node arcade-accessories-/buy-cart.test.cjs
            node --check Products/store.js
            node --check Products/product.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Import all preserved Games Planet pages, assets and backend source into one repository"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
